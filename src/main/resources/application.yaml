server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: external.gateway
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:user}
    password: ${RABBITMQ_PASSWORD:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/Parko}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
  webhook-dedup-ttl: ${MERCADOPAGO_WEBHOOK_DEDUP_TTL:P7D}
  webhook-max-age: ${MERCADOPAGO_WEBHOOK_MAX_AGE:PT24H}

ngrok:
  # El dominio parko.ngrok-free.dev lo usa access-service para el QR de pago de visitantes.
  enabled: ${NGROK_ENABLED:false}
  domain: ${NGROK_DOMAIN:parko.ngrok-free.dev}
