server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: external.gateway
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:user}
    password: ${RABBITMQ_PASSWORD:password}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:placeholder}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}

ngrok:
  enabled: ${NGROK_ENABLED:true}
  domain: ${NGROK_DOMAIN:parko.ngrok-free.dev}
